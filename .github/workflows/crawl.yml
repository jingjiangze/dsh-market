name: crawl

# Three parallel shards verify different stripes of the candidate pool; one merge
# job unions their slices into the carried catalogue, publishes the index (verified
# entries + everything the catalogs list), translates, validates and lands it
# through a pull request. The PR exists so every catalogue change has a reviewable
# diff and a green test run attached; the merge happens here because pull requests
# opened with the repository token do not start `pull_request` workflows.
on:
  schedule:
    - cron: '17 */3 * * *'   # every three hours, at :17
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate selftest
        run: node crawler/crawl.mjs --selftest

      - name: Verify this shard's slice
        env:
          NPM_REGISTRY: https://registry.npmjs.org
          SEARCH_REGISTRY: https://registry.npmjs.org
          FALLBACK_REGISTRY: https://registry.npmmirror.com
          DSH_RUNTIME_VERSION: 0.2.1-rc.5
          SHARD: ${{ matrix.shard }}
          SHARDS: '3'
          MAX_CANDIDATES: '900'
          CONCURRENCY: '12'
          CRAWL_BUDGET_MS: '600000'
          MERGE_EXTERNAL: '0'
          SOURCES: dshso,awesome,mydsh
          PART_OUT: dist/part-${{ matrix.shard }}.json
        run: node crawler/crawl.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: dist/part-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the real format-1 validator
        run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: dist
          merge-multiple: true

      - name: Union the shard slices
        run: node crawler/merge-parts.mjs

      - name: Build the published index
        env:
          NPM_REGISTRY: https://registry.npmjs.org
          SEARCH_REGISTRY: https://registry.npmjs.org
          FALLBACK_REGISTRY: https://registry.npmmirror.com
          DSH_RUNTIME_VERSION: 0.2.1-rc.5
          MAX_TOTAL: '12000'
          MERGE_EXTERNAL: '1'
          SOURCES: dshso,awesome,mydsh
        run: node crawler/crawl.mjs --publish-only

      - name: Fill stars and weekly downloads
        # Catalog-only entries carry a repository but no numbers. One GitHub call per
        # distinct repo (token, budget, 3-day cache) fills stars; npm's public point
        # API fills weekly downloads. Both are best-effort: what is fetched lands,
        # the rest is retried next run.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENRICH_CONCURRENCY: '10'
          ENRICH_BUDGET_MS: '480000'
          ENRICH_MAX_REPOS: '3500'
          ENRICH_MAX_DOWNLOADS: '3000'
        run: node crawler/enrich.mjs

      - name: Add the other languages
        # The detail drawer shows one language at a time, so every entry needs its
        # ja/ko/ru text: a bigger per-run budget fills a 10k catalogue in a few runs
        # while the content-hash cache keeps later runs cheap.
        env:
          TRANSLATE_LANGS: ja,ko,ru
          TRANSLATE_CONCURRENCY: '16'
          TRANSLATE_MAX_STRINGS: '1500'
          TRANSLATE_BUDGET_MS: '480000'
        run: node crawler/translate.mjs

      - name: Assemble the site
        run: |
          cp dist/index.json site/index.json
          cp dist/index.cn.json site/index.cn.json
          cp dist/index.intl.json site/index.intl.json
          cp dist/index.sidecar.json site/sidecar.json
          cp dist/stats.json site/stats.json

      - name: Build the browse chunks
        # The page reads ~330 KB of chunks instead of the 11.5 MB format-1 document.
        run: node crawler/browse.mjs

      - name: Publish assets and browse data to ModelScope
        # 0.16-0.19 s per file from ModelScope against 7.4 s on jsDelivr, with
        # Access-Control-Allow-Origin: * and a correct Content-Type per extension.
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_DATASET: jingjiangze/Anime-JPG
        run: node crawler/ms-upload.mjs

      - name: Publish assets under a content-addressed path
        # Points the shell at the dataset copy of exactly these bytes, so a redesign
        # cannot be masked by any CDN's long-lived cache.
        run: node crawler/assets.mjs

      - name: Validate before anything lands
        # Content checks only: the CDN copy of the site assets cannot be fresh
        # before this branch merges, so mirror freshness is verified by `ci` and
        # `deploy` on main instead of failing the crawl.
        run: node crawler/validate.mjs --offline

      - id: publish
        name: Publish through the GitHub Git Data API
        # The runner could not `git push` ("failed to push some refs"), which froze
        # the published catalogue while every other step stayed green. The REST API
        # writes the same commit and has been reliable, so the PR round trip is gone:
        # content is already validated above, and `ci` re-checks main afterwards.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_PATHS: dist site data
          PUBLISH_MESSAGE: 'chore(crawl): refresh plugin index'
        run: |
          set -o pipefail
          OUT=$(node crawler/publish-api.mjs | tee /dev/stderr)
          if echo "$OUT" | grep -q 'commit '; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the deploy
        # A commit written with the repository token does not start workflows on its
        # own, so the deploy is dispatched explicitly.
        if: steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
