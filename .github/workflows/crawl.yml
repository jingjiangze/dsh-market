name: crawl

# Crawl on a schedule, validate the result, then land it through a pull request:
# crawl → tests → PR → squash-merge → deploy. The PR exists so every catalog
# change has a reviewable diff and a green test run attached; the merge happens
# in this workflow because pull requests opened with the repository token do not
# start `pull_request` workflows (GitHub suppresses that recursion).
on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the real format-1 validator
        run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5

      - name: Gate selftest
        run: node crawler/crawl.mjs --selftest

      - name: Crawl
        env:
          NPM_REGISTRY: https://registry.npmjs.org
          SEARCH_REGISTRY: https://registry.npmjs.org
          DSH_RUNTIME_VERSION: 0.2.1-rc.5
          MAX_PLUGINS: '200'
        run: node crawler/crawl.mjs

      - name: Assemble the site
        run: |
          cp dist/index.json site/index.json
          cp dist/index.sidecar.json site/sidecar.json
          cp dist/stats.json site/stats.json

      - name: Validate before anything lands
        run: node crawler/validate.mjs

      - id: diff
        name: Did the catalog change?
        run: |
          if git diff --quiet -- dist/index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no catalog change"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- dist/index.json
          fi

      - name: Open and merge the crawl pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: crawl/${{ github.run_id }}
        run: |
          KEPT=$(node -e "console.log(require('./dist/stats.json').kept)")
          TOTAL=$(node -e "console.log(require('./dist/stats.json').candidates)")
          git config user.name "dsh-market-bot"
          git config user.email "dsh-market-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add dist site
          git commit -m "chore(crawl): refresh plugin index"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(crawl): refresh plugin index" \
            --body "Automated crawl: kept ${KEPT} of ${TOTAL} candidates; validated in run ${GITHUB_RUN_ID} with the validator DSH itself runs, plus page-budget and registry checks."
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: Publish the merged catalog
        # A merge pushed with the repository token does not start workflows on
        # itself, so the deploy is dispatched explicitly instead of waiting for
        # a push event that will never arrive.
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
