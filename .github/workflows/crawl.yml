name: crawl

# Three parallel shards verify different stripes of the candidate pool. The merge job
# assembles and validates the complete release, then commits it to main through the
# Git Data API. All release gates therefore run before the write; push-triggered CI
# remains a post-publish regression check.
on:
  schedule:
    - cron: '17 */3 * * *'   # every three hours, at :17
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if a crawl already succeeded recently'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Own group, not a shared one: the other publisher holds a shared lock for ~50 of every
# 60 minutes, and a second arrival cancels the earlier *pending* run. Conflicts are
# handled inside crawler/publish-api.mjs, which re-reads the ref and retries.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        name: Decide whether this run is needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          # Scheduled runs are the cadence itself; they always proceed.
          if [ "${EVENT}" != "workflow_dispatch" ] || [ "${FORCE}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "proceeding (${EVENT:-schedule}, force=${FORCE:-false})"
            exit 0
          fi
          last=$(gh run list --workflow crawl.yml --status success --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || echo "")
          if [ -z "$last" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "no successful crawl on record — proceeding"
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "last successful crawl: $last (${age} min ago)"
          # 90 minutes: a crawl needs ~40, the cron runs every 180. Inside that window a manual
          # dispatch would republish almost the same catalogue.
          if [ "$age" -lt 90 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping — a crawl succeeded ${age} min ago (pass force=true to override)"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  shard:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate selftest
        run: node crawler/crawl.mjs --selftest

      - name: Verify this shard's slice
        env:
          NPM_REGISTRY: https://registry.npmjs.org
          SEARCH_REGISTRY: https://registry.npmjs.org
          FALLBACK_REGISTRY: https://registry.npmmirror.com
          DSH_RUNTIME_VERSION: 0.2.1-rc.5
          SHARD: ${{ matrix.shard }}
          SHARDS: '3'
          MAX_CANDIDATES: '900'
          CONCURRENCY: '12'
          CRAWL_BUDGET_MS: '600000'
          MERGE_EXTERNAL: '0'
          SOURCES: dshso,awesome,mydsh,polang,official,github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAX_REPOS: '150'
          PART_OUT: dist/part-${{ matrix.shard }}.json
        run: node crawler/crawl.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: dist/part-${{ matrix.shard }}.json
          retention-days: 1

  build:
    needs: shard
    runs-on: ubuntu-latest
    # A full build takes ~35-40 min (2BingLing npm probe ~6 min, icon mirror ~12 min,
    # translate, browse chunks). 40 min killed every crawl at the last step and looked
    # like an unexplained "cancelled" run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the real format-1 validator
        run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: dist
          merge-multiple: true

      - name: Union the shard slices
        run: node crawler/merge-parts.mjs

      - name: Adapt the 2BingLing catalogue
        # 18k entries, most of them GitHub-only. Names missing on npm are pinned to a
        # repository commit so every published entry really can be installed. The
        # adapter caches the 13.8 MB document and its commit lookups by upstream date.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINGLING_MIN_STARS: '0'
          BINGLING_MAX_GIT_LOOKUPS: '1500'
        run: node crawler/source-2bingling.mjs

      - name: Build the published index
        env:
          NPM_REGISTRY: https://registry.npmjs.org
          SEARCH_REGISTRY: https://registry.npmjs.org
          FALLBACK_REGISTRY: https://registry.npmmirror.com
          DSH_RUNTIME_VERSION: 0.2.1-rc.5
          MAX_TOTAL: '32000'
          MERGE_EXTERNAL: '1'
          SOURCES: dshso,awesome,mydsh,polang,official,github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAX_REPOS: '150'
        run: node crawler/crawl.mjs --publish-only

      - name: Fill stars and weekly downloads
        # Catalog-only entries carry a repository but no numbers. One GitHub call per
        # distinct repo (token, budget, 3-day cache) fills stars; npm's public point
        # API fills weekly downloads. Both are best-effort: what is fetched lands,
        # the rest is retried next run.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENRICH_CONCURRENCY: '10'
          ENRICH_BUDGET_MS: '480000'
          ENRICH_MAX_REPOS: '3500'
          ENRICH_MAX_DOWNLOADS: '3000'
        run: node crawler/enrich.mjs

      - name: Give npm-less entries a git install target
        # Characters that exist only in a catalog have no npm package to install, so
        # they are pinned to a repository commit instead (the schema's `git` source).
        # Capped and cached: ~2.7k candidates at 600 per run.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_SOURCE_CONCURRENCY: '8'
          GIT_SOURCE_BUDGET_MS: '480000'
          GIT_SOURCE_MAX: '600'
        run: node crawler/git-source.mjs

      - name: Add the other languages
        # Only the increment: the cache makes repeats free, and the dedicated
        # translate.yml job works through the backlog on its own schedule.
        env:
          TRANSLATE_LANGS: zh,ja,ko,ru   # zh first: the catalogue is read in Chinese
          TRANSLATE_CONCURRENCY: '12'
          TRANSLATE_MAX_STRINGS: '3000'
          TRANSLATE_BUDGET_MS: '480000'
        run: node crawler/translate.mjs

      - name: Probe the registry sources
        # 54% of the catalogue claims an npm source that does not resolve anywhere; that is
        # what makes the client's pre-install probe fail. Record the truth once per run.
        env:
          PROBE_CONCURRENCY: '40'
          PROBE_TIMEOUT_MS: '8000'
          PROBE_BUDGET_MS: '600000'
          PROBE_TTL_DAYS: '14'
        run: node crawler/probe-npm.mjs

      - name: Fill engines.dsh from the package manifest
        # A catalogue range can be stale (dsh-ops: catalogue said >=0.2.0-0, the package
        # declares >=0.2.2-rc.1), which is how an install fails halfway with
        # incompatible-version. The manifest is authoritative; the size it returns is what
        # the site shows as 安装体积.
        env:
          MANIFEST_CONCURRENCY: '24'
          MANIFEST_TIMEOUT_MS: '10000'
          MANIFEST_BUDGET_MS: '480000'
          MANIFEST_TTL_DAYS: '14'
        run: node crawler/probe-manifest.mjs

      - name: Pin commits for the entries npm never received
        # Turns a row that claims a missing npm package into a commit-pinned git source:
        # 100 repositories per GraphQL request, so the whole backlog fits in one run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN_BATCH: '100'
          PIN_CONCURRENCY: '3'
          PIN_BUDGET_MS: '600000'
          PIN_MAX: '2500'
          PIN_RATE_FLOOR: '900'
        run: node crawler/pin-missing.mjs

      - name: Restore real package names
        # An older crawler disambiguated collisions by appending a counter, so 700+ rows
        # carried names like dsh-fish-3 that no registry has. Rename them back and merge
        # the duplicates they created.
        run: node crawler/restore-alias.mjs

      - name: Build one index per language
        run: node crawler/lang-index.mjs

      - name: Assemble the site
        run: |
          # Only the small, user-facing files are assembled here. index.json and the
          # sidecar are build products kept out of git (see .gitignore): the site
          # renders from the browse chunks in the dataset and DSH subscribes to
          # index.zh.json, so committing them cost ~24 MB per crawl for nothing.
          cp dist/stats.json site/stats.json

      - name: Mirror the icons
        # Avatars and package icons are copied into the dataset (7112 URLs at the
        # last audit) so the page does not depend on github.com; the origin URL
        # stays in the entry as the browser-side fallback.
        env:
          ICON_CONCURRENCY: '16'
          ICON_BUDGET_MS: '720000'
          # 7,112 urls in total; 3,000 per run fills the mirror in ~3 runs.
          ICON_MAX_PER_RUN: '3000'
        run: node crawler/icons.mjs

      - name: Publish the plugin-facing index
        # Format 1 drops members it does not define, so the facts an on-demand loader needs
        # (real install target, installability, curation) get their own document instead of
        # being re-derived from strings.
        run: node crawler/plugin-index.mjs
      - name: Build the browse chunks
        # The page reads a ~350 KB first chunk instead of the 11.5 MB format-1 document.
        env:
          BROWSE_CHUNK: '250'
        run: node crawler/browse.mjs

      - name: Hash the assets the shell references
        # Must run BEFORE the dataset upload: the shell names a content-addressed
        # directory, and if the upload happens first that directory does not exist
        # yet (that is what left tier 1 answering 404).
        run: node crawler/assets.mjs

      - name: Hand the catalogue to the gates
        # The gates and the publishers run in their own jobs so a failed publish can be
        # retried without repeating 2BingLing adapt, enrich, translate and the icon mirror.
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          retention-days: 3
          path: |
            dist
            site
            data

  verify:
    needs: build
    runs-on: ubuntu-latest
    # Gates only: no network writers, so this fails fast and cheap.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the real format-1 validator
        # verify runs crawler/validate.mjs, which imports the real format package. Without
        # this the gate fails on a missing module instead of reporting on the catalogue —
        # exactly the failure the first split run produced.
        run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5
      - name: Take the built catalogue
        uses: actions/download-artifact@v4
        with:
          name: catalog

      - name: Validate before anything lands
        run: node crawler/validate.mjs --offline

      - name: Run release gates before publishing
        env:
          MAX_CANDIDATES: '60'
          MAX_PLUGINS: '60'
          CONCURRENCY: '6'
          SOURCES: awesome
        run: |
          node --check site/app.js
          node crawler/smoke-app.mjs
          node crawler/validate.mjs
          node crawler/crawl.mjs --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Take the built catalogue
        uses: actions/download-artifact@v4
        with:
          name: catalog

      - name: Publish assets, browse data and icons to ModelScope
        # 0.16-0.19 s per file from ModelScope against 7.4 s on jsDelivr, with
        # Access-Control-Allow-Origin: * and a correct Content-Type per extension.
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_DATASET: jingjiangze/Anime-JPG
        run: node crawler/ms-upload.mjs


      # No deploy dispatch here: this workflow pushes to main, and deploy.yml runs on push
      # for site/** and dist/**. Dispatching as well deployed twice per crawl and the
      # concurrency group cancelled one of them.

      # Required, not redundant: a push made with GITHUB_TOKEN does not trigger other
      # workflows, so deploy.yml's push trigger never sees this commit. Removing this step
      # once shipped a new catalogue without redeploying the site.

      - id: publish
        name: Publish through the GitHub Git Data API
        # The runner could not `git push` ("failed to push some refs"), which froze
        # the published catalogue while every other step stayed green. The REST API
        # writes the same commit and has been reliable, so the PR round trip is gone:
        # content is already validated above, and `ci` re-checks main afterwards.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_PATHS: dist site data
          # The crawl only owns DATA files. site/index.html, style.css, app.js and
          # site/a/<hash>/ are the UI bundle: they are built by `assets.mjs` and
          # committed separately. Letting the crawl publish its own checkout of them
          # rewrote the shell to a stale hashed CSS and broke every new UI element
          # (un-styled recommendation rail, favorite buttons and trust badges).
          PUBLISH_EXCLUDE: '(^|/)(index\.cn\.json|index\.intl\.json|index\.sidecar\.json|sidecar\.json)$|^dist/index\.json$|^site/index\.json$|^site/index\.(en|ja|ko|ru)\.json$|^site/index\.html$|^site/style\.css$|^site/app\.js$|^site/a/'
          PUBLISH_MESSAGE: 'chore(crawl): refresh plugin index'
        run: |
          set -o pipefail
          OUT=$(node crawler/publish-api.mjs | tee /dev/stderr)
          if echo "$OUT" | grep -q 'commit '; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the deploy
        # publish-api already reports whether it wrote a commit; skip the deploy when the
        # catalogue is byte-identical, so an idle run does not redeploy anything.
        if: steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Validate the landed commit
        # The publish step commits with the installation token, and those pushes do not start
        # other workflows, so nothing would ever check the tree that just landed. Dispatch ci
        # against it: this catches a publish that wrote the wrong files, not just wrong data.
        if: steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
      - name: Watchdog — revive a stalled translate job
        # The mirror of the watchdog in translate.yml: whichever schedule GitHub
        # actually delivers revives the other one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One pending run per concurrency group: GitHub cancels the earlier pending
          # run when a third arrives, which is how three crawls in a row were cancelled
          # while translate held catalog-publish. Dispatch through this instead of
          # calling `gh workflow run` directly.
          queue() {
          local wf="$1"
          local busy
          busy=$(gh run list --workflow "$wf" --limit 5 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length' 2>/dev/null || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then
          echo "$wf already running or queued — not dispatching"
          return 0
          fi
          gh workflow run "$wf" --ref main
          }
          last=$(gh run list --workflow translate.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          if [ -z "$last" ]; then
            echo "no successful translate recorded — dispatching one"
            queue translate.yml
            exit 0
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "last successful translate: $last (${age_h}h ago)"
          if [ "$age_h" -ge 3 ]; then
            echo "translation backlog is stalling — dispatching translate"
            queue translate.yml
          fi
