name: crawl

# Crawl on a schedule and propose the result as a pull request. Nothing lands on
# main directly: `ci` validates the PR and merges it, `deploy` publishes main.
on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Selftest the gates
        run: node crawler/crawl.mjs --selftest

      - name: Crawl
        env:
          NPM_REGISTRY: https://registry.npmjs.org
          SEARCH_REGISTRY: https://registry.npmjs.org
          DSH_RUNTIME_VERSION: 0.2.1-rc.5
          MAX_PLUGINS: '200'
        run: node crawler/crawl.mjs

      - name: Assemble the site
        run: |
          cp dist/index.json site/index.json
          cp dist/index.sidecar.json site/sidecar.json
          cp dist/stats.json site/stats.json

      - id: diff
        name: Did the catalog change?
        run: |
          if git diff --quiet -- dist/index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no catalog change"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- dist/index.json
          fi

      - name: Open the crawl pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: crawl/${{ github.run_id }}
        run: |
          KEPT=$(node -e "console.log(require('./dist/stats.json').kept)")
          TOTAL=$(node -e "console.log(require('./dist/stats.json').candidates)")
          git config user.name "dsh-market-bot"
          git config user.email "dsh-market-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add dist site
          git commit -m "chore(crawl): refresh plugin index"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(crawl): refresh plugin index" \
            --body "Automated crawl: kept ${KEPT} of ${TOTAL} candidates. ci validates this branch with the real format-1 validator and merges it when green."
