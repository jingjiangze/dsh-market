name: translate

# Fills the ja/ko/ru text for the catalogue and republishes the per-language
# indexes. It runs on its own schedule so the crawl stays short: the crawl keeps a
# small incremental pass (the content-hash cache makes it nearly free), and this job
# works through the backlog.
on:
  schedule:
    - cron: '37 * * * *'   # hourly, offset from the crawl
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Own group, not a shared one: the other publisher holds a shared lock for ~50 of every
# 60 minutes, and a second arrival cancels the earlier *pending* run. Conflicts are
# handled inside crawler/publish-api.mjs, which re-reads the ref and retries.
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the published index
        # dist/index.json is committed by the crawl (with translations replayed), so
        # it is always newer than the Pages copy of site/index.json. Reading Pages
        # used to make this job rebuild language docs from a stale 11k catalogue.
        run: |
          mkdir -p dist
          node -e "
          const fs = require('fs')
          const path = 'dist/index.json'
          if (!fs.existsSync(path) || fs.statSync(path).size < 1000000) {
            console.error('dist/index.json missing or too small; the crawl must run first')
            process.exit(1)
          }
          console.log('plugins', JSON.parse(fs.readFileSync(path, 'utf8')).plugins.length)
          "

      - name: Translate the backlog
        env:
          TRANSLATE_LANGS: zh,ja,ko,ru   # zh first: the catalogue is read in Chinese
          TRANSLATE_CONCURRENCY: '16'
          TRANSLATE_MAX_STRINGS: '30000'
          TRANSLATE_BUDGET_MS: '2700000'
        run: node crawler/translate.mjs

      - name: Build one index per language
        run: node crawler/lang-index.mjs

      - name: Assemble the served copy
        # `ci` compares site/index.json with dist/index.json byte for byte, and this
        # job is what adds the translations to dist 鈥?without this copy the two drift
        # and every push after a translate run fails the gate.
        run: cp dist/index.json site/index.json

      - name: Publish the language indexes to the dataset
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_DATASET: jingjiangze/Anime-JPG
          MODELSCOPE_SKIP_DOCS: '0'
        run: node crawler/ms-upload.mjs

      - name: Commit the cache and the language indexes
        # Same API path the crawl uses: `git push` is not reliable from the runner.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_PATHS: data dist site
          # Data only — never overwrite the UI bundle (see crawl.yml for the reason).
          PUBLISH_EXCLUDE: '^site/index\.html$|^site/style\.css$|^site/app\.js$|^site/a/|^site/index\.json$|^site/index\.(en|ja|ko|ru)\.json$'
          PUBLISH_MESSAGE: 'chore(i18n): fill ja/ko/ru text and refresh the per-language indexes'
        run: |
          set -o pipefail
          node crawler/publish-api.mjs | tee /dev/stderr

      - name: Watchdog — revive a stalled crawl
        # GitHub's scheduler is best-effort and dropped every cron event for a whole
        # morning (all workflows stayed `active`). This job runs hourly, so whichever
        # schedule survives can revive the other one: a stale crawl is re-dispatched
        # from here instead of waiting for a human.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One pending run per concurrency group: GitHub cancels the earlier pending
          # run when a third arrives, which is how three crawls in a row were cancelled
          # while translate held catalog-publish. Dispatch through this instead of
          # calling `gh workflow run` directly.
          queue() {
          local wf="$1"
          local busy
          busy=$(gh run list --workflow "$wf" --limit 5 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length' 2>/dev/null || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then
          echo "$wf already running or queued — not dispatching"
          return 0
          fi
          gh workflow run "$wf" --ref main
          }
          last=$(gh run list --workflow crawl.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          if [ -z "$last" ]; then
            echo "no successful crawl recorded — dispatching one"
            queue crawl.yml
            exit 0
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "last successful crawl: $last (${age_h}h ago)"
          if [ "$age_h" -ge 4 ]; then
            echo "catalogue is stale — dispatching crawl"
            queue crawl.yml
          fi

      # translate rewrites site/index.zh.json, and its commit carries the same token, so
      # the push trigger cannot fire. Deploy only when the served document changed.
      - name: Trigger the deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(git show --name-only --format= HEAD | grep -c '^site/index.' || true)
          if [ "${files:-0}" -gt 0 ]; then
            gh workflow run deploy.yml --ref main
          else
            echo "no served document changed — not deploying"
          fi
