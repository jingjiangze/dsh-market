name: deploy

# Publishes main to both endpoints. Only runs after a change landed on main —
# normally a merged crawl PR — so nothing is published that `ci` has not tested.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'dist/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        # The brand domain mirrors GitHub Pages; it is not the source of truth.
        # wrangler's asset check has returned 500 on a ~20 MB upload, which must
        # not fail the whole deploy and hide the Pages result.
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=dsh-market --branch=main --commit-dirty=true

  verify:
    # Publishing is not done until the deployed bytes are the tested bytes.
    needs: [pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5
      - name: Purge the jsDelivr copies of the site assets
        # The page loads its CSS and JS from jsDelivr @main, which caches for up
        # to 12 hours. Without a purge a redesign would not reach readers.
        run: |
          for asset in site/style.css site/app.js; do
            curl -sS --max-time 25 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$asset" || true
          done
          sleep 5
      - name: Deployed copies must match the repository
        run: |
          for attempt in 1 2 3 4 5; do
            if node crawler/verify-deployed.mjs; then exit 0; fi
            echo "attempt $attempt failed, waiting for CDN propagation"
            sleep 20
          done
          exit 1

