name: deploy

# Publishes main to both endpoints.
#
# The push trigger below only fires for commits pushed with a user credential. The crawler
# commits with the installation token, and GitHub suppresses workflow runs for those pushes,
# so crawl.yml dispatches this workflow explicitly after publishing. Do not remove that
# dispatch on the assumption that the push trigger covers it — it does not (that mistake
# once shipped a new catalogue without redeploying the site).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'dist/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API quota
        # A deployment needs ~10 API calls; a crawl in the same hour can leave none and
        # configure-pages then fails with "rate limit exceeded for installation" even though
        # the site is fine. Wait for the window instead of failing the deploy.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 10); do
            remaining=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo 0)
            echo "core quota remaining: ${remaining:-0} (attempt $attempt)"
            if [ "${remaining:-0}" -ge 200 ]; then exit 0; fi
            sleep 60
          done
          echo "::warning::deploying with a nearly exhausted API quota"
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Cloudflare bundle
        # The brand domain is the relay a DSH index source can actually use: the
        # ModelScope dataset answers 302 to its CDN and DSH rejects redirects, while
        # GitHub Pages takes 40-88 s from China. So the shell, its hashed assets and
        # ONE language index (zh) are served straight from here — no Worker involved.
        # Only one document goes up at a time: a ~20 MB bundle used to make
        # wrangler's asset check return 500 and froze this deployment.
        run: |
          mkdir -p site-cf
          cp site/index.html site/style.css site/app.js site-cf/
          cp -r site/a site-cf/a
          cp site/_headers site-cf/ 2>/dev/null || true
          cp site/stats.json site-cf/ 2>/dev/null || true
          # The documents the comment above promises: without them this domain answered a
          # 2 KB HTML fallback for index.zh.json and plugin-index.json, so a reader in China
          # got the shell from here and had to fall back to Pages (40-88 s) for the data.
          cp site/index.zh.json site-cf/ 2>/dev/null || true
          cp site/plugin-index.json site-cf/ 2>/dev/null || true
          du -sh site-cf
      - uses: cloudflare/wrangler-action@v3
        # The brand domain mirrors GitHub Pages; it is not the source of truth.
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-cf --project-name=dsh-market --branch=main --commit-dirty=true

  verify:
    # Publishing is not done until the deployed bytes are the tested bytes.
    needs: [pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5
      - name: Purge the jsDelivr copies of the site assets
        # The page loads its CSS and JS from jsDelivr @main, which caches for up
        # to 12 hours. Without a purge a redesign would not reach readers.
        run: |
          for asset in site/style.css site/app.js; do
            curl -sS --max-time 25 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$asset" || true
          done
          sleep 5
      - name: Deployed copies must match the repository
        run: |
          for attempt in 1 2 3 4 5; do
            if node crawler/verify-deployed.mjs; then exit 0; fi
            echo "attempt $attempt failed, waiting for CDN propagation"
            sleep 20
          done
          exit 1

