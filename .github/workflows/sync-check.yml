name: sync-check

# Watches what users actually download. The crawl only lands through a merged PR,
# so a drift here means a publish or a CDN copy lagged behind the repository.
on:
  schedule:
    - cron: '47 */3 * * *'   # every three hours, offset from the crawl
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the real format-1 validator
        run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5

      - name: Compare the deployed index with the repository
        run: node crawler/verify-deployed.mjs

      - name: Ask for a redeploy when the copies drifted
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Watchdog — restart a stalled crawl
        # GitHub runs scheduled workflows on a best-effort basis and has skipped the
        # 3-hourly crawl for a whole night. This check runs on the same cadence, so it
        # also notices a stale catalogue and re-dispatches the crawl.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One pending run per concurrency group: GitHub cancels the earlier pending
          # run when a third arrives, which is how three crawls in a row were cancelled
          # while translate held catalog-publish. Dispatch through this instead of
          # calling `gh workflow run` directly.
          queue() {
          local wf="$1"
          local busy
          busy=$(gh run list --workflow "$wf" --limit 5 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length' 2>/dev/null || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then
          echo "$wf already running or queued — not dispatching"
          return 0
          fi
          gh workflow run "$wf" --ref main
          }
          last=$(gh run list --workflow crawl.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          if [ -z "$last" ]; then
            echo "no successful crawl recorded — dispatching one"
            queue crawl.yml
            exit 0
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "last successful crawl: $last (${age_h}h ago)"
          # 6h, not 4h: the crawl runs every 3h and needs 30-45 min, so a 4h threshold
          # kept re-dispatching a crawl while the previous one was still in flight.
          if [ "$age_h" -ge 4 ]; then
            echo "catalogue is stale — dispatching crawl"
            queue crawl.yml
          fi
