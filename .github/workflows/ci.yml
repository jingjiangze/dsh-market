name: ci

# Runs on every push and every pull request. A green run is the only thing that
# may merge a crawl branch or publish the site, so the tests live here and the
# deploy workflow only follows a merged main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the real format-1 validator
        run: npm i --no-save @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.5

      - name: Gate selftest (positive + negative cases)
        run: node crawler/crawl.mjs --selftest

      - name: Syntax-check the browser bundle
        run: node --check site/app.js

      - name: Smoke-test the rendered page against the real index
        run: node crawler/smoke-app.mjs

      - name: Build the language documents
        # The publication step the crawl runs. On 2026-11-07 main imported
        # crawler/category-gate.mjs without shipping the module: every crawl died at this
        # step while ci stayed green, because ci never executed it.
        env:
          CATEGORY_GATE: warn
          LANG_INDEX_BUDGET_MB: '8'
        run: node crawler/lang-index.mjs
      - name: Validate the published index
        run: node crawler/validate.mjs

      - name: Crawler still runs end to end
        # A smoke run, not the full crawl: the real crawl runs on its own schedule.
        env:
          MAX_CANDIDATES: '60'
          MAX_PLUGINS: '60'
          CONCURRENCY: '6'
          SOURCES: awesome
        run: node crawler/crawl.mjs --dry-run
